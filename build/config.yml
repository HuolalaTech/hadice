# Wails v3 Build Configuration
# This file is used by Wails during the build process

version: "3"

info:
  companyName: "huolala"
  productName: "Hadice"
  productIdentifier: "com.haivo.hadice"
  description: "安卓&鸿蒙调试工具"
  copyright: "(c) 2026, Haivo"
  version: "2.3.0"


# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
